appId: com.sistemapos.desktop
productName: Sistema POS HK
electronVersion: 32.3.3
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sistema POS HK

# Actualizaciones automaticas via GitHub Releases. IMPORTANTE: reemplaza
# owner/repo por tu usuario/organizacion y el nombre real del repositorio de
# GitHub antes de publicar una release (npx electron-builder --win --publish always),
# o "Buscar actualizaciones" en la app no encontrara nada.
publish:
  provider: github
  owner: TU-USUARIO-GITHUB
  repo: sistema-pos-hk
